<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none" class="gp-logo-svg">
  <defs>
    <linearGradient id="gpGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4C77A" />
      <stop offset="50%" stop-color="#C9A45C" />
      <stop offset="100%" stop-color="#9A7730" />
    </linearGradient>
    <filter id="gpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crown (Subtle, elegant, secondary) -->
  <g class="gp-crown" stroke="url(#gpGoldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M42 24 L48 13 L60 21 L72 13 L78 24 Z" fill="url(#gpGoldGrad)" fill-opacity="0.15" />
    <circle cx="48" cy="12" r="1.5" fill="#E4C77A" />
    <circle cx="60" cy="19" r="1.5" fill="#E4C77A" />
    <circle cx="72" cy="12" r="1.5" fill="#E4C77A" />
  </g>

  <!-- Monogram GP -->
  <!-- Stylized G and P interlocked/flowing script/geometric ribbon -->
  <g stroke="url(#gpGoldGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- G shape: curves from top-right of G arc around to base, then rises and turns in -->
    <path d="M48 42 C40 38, 25 46, 25 61 C25 76, 38 84, 53 84 C68 84, 76 74, 76 61 L76 56 L55 56" />
    
    <!-- P shape: stem descends from high middle, loops around on top -->
    <path d="M68 36 L68 84" />
    <path d="M68 36 C80 36, 95 38, 95 50 C95 62, 80 64, 68 64" />
  </g>
</svg>
